version: 2

models:
  - name: dim_sample
    columns:
      - name: sample_id
        tests: [unique, not_null]

  - name: dim_experiment
    columns:
      - name: experiment_id
        tests: [unique, not_null]

  - name: fct_plate_well
    columns:
      - name: well_assignment_id
        tests: [unique, not_null]
      - name: sample_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_sample')
                field: sample_id
      - name: experiment_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_experiment')
                field: experiment_id

  - name: fct_result
    columns:
      - name: result_id
        tests: [unique, not_null]
      - name: experiment_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_experiment')
                field: experiment_id

  - name: mart_experiment_audit
    columns:
      - name: experiment_id
        tests: [unique, not_null]
      - name: transition_count
        tests: [not_null]

  - name: fct_reading
    columns:
      - name: reading_id
        tests: [unique, not_null]
      - name: quality
        tests:
          - accepted_values:
              arguments:
                values: ["ok", "device-error", "transport-error"]

  - name: fct_alarm
    columns:
      - name: alarm_id
        tests: [unique, not_null]
      - name: reading_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_reading')
                field: reading_id

  - name: mart_channel_health
    columns:
      - name: channel
        tests: [unique, not_null]
      - name: reading_count
        tests: [not_null]
